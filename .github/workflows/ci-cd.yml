name: CI PIPELINE

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: docker build -t ci-cd-practice-pipeline .
      
      - name: Run Docker container
        run: docker run --rm -p="9091:9091" ci-cd-practice-pipeline 

